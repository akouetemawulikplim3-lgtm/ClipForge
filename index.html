<!DOCTYPE html>
<html lang="fr">
<style>
body {
    background-color: #10111a;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

h1 {
    font-size: 36px;
    color: #8b5cf6;
    texte-alagin: center;
}

h2 {
    texte-alagin: center;
}
input[type="file"] {
    display: block;
    margin: 25px auto;
    padding: 15px;
    background-color: #242538;
    color: white;
    border: 1px solid #8b5cf6;
    border-radius: 10px;
}
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"

content="width=device-width,
initial-scale=1.0">
    <title>ClipForge</title>
</head>
<body>
<h1>ClipForge</h1>
<p>Transforme tes longues videos en Clips captivants.</p>
<h2>Importer une video</h2>
<p>Selectionne une video depuis ton appareil pour commencer.</p>
<p>Formats acceptes : MP4, MOV et autres formats videos.</p>
<input type="file" id="videoInput" accept="video/*">
<video id="videoPreview" controls width="100%"></video>
<script>
const videoInput=
document.getElementById("videoInput");
const videoPreview=
document.getElementById("videoPreview");

videoInput.addEventListener("change",function() {
    const file =
videoInput.files[0];
    if (file) {
        videoPreview.src =
URL.createObjectURL(file);
    }
});
</script>
</body>
</html>
